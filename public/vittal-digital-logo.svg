<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="540" height="140" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED000"/>
      <stop offset="45%" stop-color="#E5A900"/>
      <stop offset="100%" stop-color="#C68A00"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D0B12"/>
      <stop offset="100%" stop-color="#150306"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem / Crest: Hexagonal Shield with Stylized VD Monogram -->
  <g transform="translate(20, 15)">
    <!-- Outer Shield Hexagon -->
    <polygon points="55,0 110,32 110,78 55,110 0,78 0,32" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
    
    <!-- Inner Accent Ring -->
    <polygon points="55,8 100,34 100,74 55,100 10,74 10,34" fill="none" stroke="#FED000" stroke-width="1.2" opacity="0.45" stroke-dasharray="4,3"/>

    <!-- 'V' Monogram Path in Gold -->
    <path d="M 32 35 L 55 82 L 78 35" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Interlocking 'D' Arc in Gold -->
    <path d="M 55 35 H 68 C 82 35 88 47 88 58 C 88 71 80 82 66 82 H 55" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Center Sparkle / Star of Authenticity -->
    <circle cx="55" cy="58" r="3" fill="#FFF8D6" filter="url(#glow)"/>
  </g>

  <!-- Brand Typography -->
  <!-- 1. "VITTAL" -->
  <text x="155" y="65" font-family="'Cinzel', 'Playfair Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="4">
    VITTAL
  </text>

  <!-- 2. "DIGITAL" in Radiant Gold -->
  <text x="157" y="102" font-family="'Cinzel', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="700" fill="url(#goldGrad)" letter-spacing="8">
    DIGITAL
  </text>

  <!-- 3. Fine Quality Accent Bar & Tagline -->
  <line x1="330" y1="96" x2="510" y2="96" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>
  <text x="330" y="112" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="10" font-weight="700" fill="#D4AF37" letter-spacing="3" opacity="0.9">
    OFFICIAL STORE
  </text>
</svg>

